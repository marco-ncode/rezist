name: CI

# Runs on every push and PR: validates data/*.json against schemas/*.schema.json,
# then runs the headless GDScript unit test suite (game/tests/). See
# docs/TECHNICAL_DESIGN_DOCUMENT.md §9 and docs/CONTRIBUTING.md for the same
# commands run locally.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  # Godot releases are tagged "4.3", not "4.3.0" — the version string used
  # verbatim in both the download URL and the extracted binary name below.
  GODOT_VERSION: "4.3"

jobs:
  validate-data:
    name: Validate data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Validate data/*.json against schemas/*.schema.json
        run: python tools/validate_data.py

  unit-tests:
    name: GDScript unit tests (headless)
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /opt/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /opt/godot
          ZIP_NAME="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          # -f makes curl fail (non-zero exit) on an HTTP error instead of
          # silently saving an error page as if it were the zip. Try the
          # tuxfamily mirror first, fall back to the GitHub release asset.
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/${ZIP_NAME}" \
            || curl -fsSL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${ZIP_NAME}"
          unzip -q /tmp/godot.zip -d /opt/godot
          mv "/opt/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /opt/godot/godot
          chmod +x /opt/godot/godot

      - name: Import project (warm up global class cache)
        # On a fresh checkout, Godot's global `class_name` lookup table
        # (.godot/global_script_class_cache.cfg) doesn't exist yet, and a
        # plain `--script` invocation does not build it first — every
        # cross-file class_name reference (TacticalGrid, TestReporter, ...)
        # then fails to resolve. `--import` runs a full editor
        # startup/filesystem scan and quits, which is what actually builds
        # that cache. Must run once, separately, before `--script`.
        run: /opt/godot/godot --headless --path game --import

      - name: Run headless unit tests
        run: /opt/godot/godot --headless --path game --script res://tests/run_tests.gd

  # RZ-137 (docs/BACKLOG.md): headless export smoke-build. Not yet wired —
  # needs export presets (RZ-138) committed first. Left as a documented gap
  # rather than a fake green step.
